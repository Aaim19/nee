<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>First Door — For Nee</title>
    <link rel="stylesheet" href="memory.css">
</head>
<body>

    <!-- Top stitched ribbon with a back link to birthday.html -->
    <header class="top-ribbon">
        <div class="ribbon-inner">
            <a href="birthday.html" class="back-btn">← Back to Doors</a>
            <span class="door-tag">01 / First Door</span>
        </div>
    </header>

    <!-- Main scrollable content -->
    <main class="page-content">

        <!-- Section 1: Title & Intro -->
        <section class="intro-section">
            <h1 class="page-title">A Letter For You</h1>
            <p class="page-subtitle">Scroll down to read every little thing I wanted to tell you.</p>
        </section>

        <!-- Section 2: Vintage Letter Card -->
        <section class="letter-card">
            <p class="letter-date">November 2026</p>
            <p>Hi Neewa,</p>
            <p>
                P1
            </p>
            <p>
                P2
            </p>
            <p class="letter-sign">Always yours ❤️</p>
        </section>

        <!-- Section 3: Scrollable Memory Snapshots -->
        <section class="memories-section">
            <h2 class="section-heading">Little Moments</h2>
            <div class="photo-row">
                <div class="polaroid tilt-left">
                    <img src="Fnee1.jpg" alt="Memory 1">
                    <p class="caption">One of my favorites</p>
                </div>
                <div class="polaroid tilt-right">
                    <img src="Fnee3.jpg" alt="Memory 2">
                    <p class="caption">Always smiling with you</p>
                </div>
                <div class="polaroid tilt-left">
                    <img src="Fnee4.jpg" alt="Memory 3">
                    <p class="caption">To many more days</p>
                </div>
            </div>
        </section>

        <!-- Bottom Navigation -->
        <footer class="bottom-nav">
            <a href="birthday.html" class="nav-pill">← Back</a>
            <a href="section2.html" class="nav-pill">Next Door (02) →</a>
        </footer>

    </main>

</body>
</html>
